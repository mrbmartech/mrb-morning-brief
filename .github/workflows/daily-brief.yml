name: mrb-morning-brief

on:
  schedule:
    # 20:00 UTC = 7:00am Melbourne in summer (AEDT), 6:00am in winter (AEST).
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set today's date (Melbourne)
        run: echo "BRIEF_DATE=$(TZ=Australia/Melbourne date +%F)" >> "$GITHUB_ENV"

      - name: Prepare instructions
        run: node scripts/build-prompt.mjs > "$RUNNER_TEMP/prompt.txt"

      - name: Write today's brief (uses Claude subscription)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --model sonnet \
            --allowedTools "WebSearch,WebFetch,Read,Write" \
            --max-turns 200

      - name: Check and build pages
        run: |
          node scripts/check-today.mjs
          node scripts/generate.mjs --render-only

      - name: Publish (Vercel redeploys automatically)
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then echo "Nothing new to publish"; exit 0; fi
          git commit -m "Morning brief $BRIEF_DATE"
          git push
